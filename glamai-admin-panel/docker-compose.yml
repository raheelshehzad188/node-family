version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glamai-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/glamai_admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - glamai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glamai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - glamai-network

  mongodb:
    image: mongo:6.0
    container_name: glamai-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secure_password
      - MONGO_INITDB_DATABASE=glamai_admin
    volumes:
      - mongodb-data:/data/db
    networks:
      - glamai-network

  redis:
    image: redis:7-alpine
    container_name: glamai-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass secure_redis_password
    volumes:
      - redis-data:/data
    networks:
      - glamai-network

networks:
  glamai-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data: